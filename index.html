<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Study Helper Bot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15px}
.header{color:white;text-align:center;margin:15px 0}
.chat-container{width:100%;max-width:420px;background:white;border-radius:20px;display:flex;flex-direction:column;height:75vh;overflow:hidden}
.chat-messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;background:#faf9ff}
.msg{max-width:85%;padding:10px 14px;border-radius:15px;font-size:14px;white-space:pre-wrap}
.msg.bot{align-self:flex-start;background:#eef2ff}
.msg.user{align-self:flex-end;background:#4f46e5;color:white}
.q-btns{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-top:1px solid #eee}
.q-btns button{border:1px solid #4f46e5;color:#4f46e5;background:white;padding:5px 10px;border-radius:20px;font-size:11px;cursor:pointer}
.input-area{display:flex;gap:8px;padding:10px;border-top:1px solid #eee}
.input-area input{flex:1;padding:10px;border:2px solid #eee;border-radius:20px;outline:none}
.input-area button{background:#4f46e5;color:white;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer}
.footer{color:white;font-size:11px;margin-top:10px;opacity:.8}
</style>
</head>
<body>
<div class="header"><h1>📚 Study Helper Bot</h1><p>12th Class - Math + Computer</p></div>
<div class="chat-container">
<div class="chat-messages" id="chat"><div class="msg bot">السلام علیکم! 🙏
میں آپ کا سٹڈی ہیلپر ہوں۔
میتھ اور کمپیوٹر کا کوئی بھی سوال پوچھیں۔</div></div>
<div class="q-btns">
<button onclick="quick('2x+5=15')">2x+5=15</button>
<button onclick="quick('Binary kya hai?')">Binary</button>
<button onclick="quick('OS kya hai?')">OS</button>
<button onclick="quick('Algorithm kya hai?')">Algorithm</button>
<button onclick="quick('Algebra kya hai?')">Algebra</button>
<button onclick="quick('RAM kya hai?')">RAM</button>
</div>
<div class="input-area"><input id="userInput" placeholder="سوال لکھیں..." onkeypress="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div>
</div>
<div class="footer">Created by cheema-lord | Gujranwala</div>
<script>
const chat=document.getElementById('chat');
const inp=document.getElementById('userInput');
function add(t,c){
let d=document.createElement('div');
d.className='msg '+c;
d.innerText=t;
chat.appendChild(d);
chat.scrollTop=chat.scrollHeight;
}
function quick(t){inp.value=t;send();}
function answer(q){
let l=q.toLowerCase();
if(l.includes('2x+5=15')) return "سوال: 2x+5=15\nStep 1: 2x = 15-5\nStep 2: 2x = 10\nStep 3: x = 5\nFinal Answer: x=5";
if(l.includes('binary')) return "Binary کیا ہے؟\nکمپیوٹر صرف 0 اور 1 سمجھتا ہے، اسی کو Binary کہتے ہیں۔\nمثال: 5 کا Binary 101 ہوتا ہے۔";
if(l.includes('os')) return "OS کیا ہے؟\nOS وہ سافٹ ویئر ہے جو کمپیوٹر کو چلاتا ہے۔\nجیسے Windows, Android۔";
if(l.includes('algo')) return "Algorithm کیا ہے؟\nکسی کام کو کرنے کا سٹیپ بائی سٹیپ طریقہ۔\nجیسے چائے بنانے کے سٹیپس۔";
if(l.includes('algebra')) return "Algebra کیا ہے؟\nمیتھ کی وہ شاخ جس میں x, y سے نامعلوم قیمت نکالتے ہیں۔";
if(l.includes('ram')) return "RAM کیا ہے؟\nیہ عارضی میموری ہے، کمپیوٹر بند ہوتے ہی ڈیٹا ختم۔";
if(l.includes('rom')) return "ROM کیا ہے؟\nیہ مستقل میموری ہے، اس کا ڈیٹا ڈیلیٹ نہیں ہوتا۔";
if(l.includes('%')) return "فیصد فارمولا: (حصہ / کل) * 100\nمثال: 100 کا 2% = 2";
try{
let r=eval(q.replace(/x/gi,'*'));
if(!isNaN(r)) return q+" = "+r;
}catch(e){}
return "آپ نے پوچھا: "+q+"\nرومن اردو: یہ 12th کلاس کا اہم ٹاپک ہے۔";
}
function send(){
let t=inp.value.trim();
if(!t) return;
add(t,'user');
inp.value='';
setTimeout(()=>{add(answer(t),'bot');},400);
}
</script>
</body>
</html>
